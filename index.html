<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>পারিবারিক আয়-ব্যয় ট্র্যাকার</title>
    <!-- Chart.js ভিজুয়াল চার্টের জন্য -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { text-align: center; color: #333; }
        .dashboard { display: flex; gap: 20px; margin-bottom: 30px; }
        .card { flex: 1; background: white; padding: 20px; border-radius: 10px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .card h3 { margin: 0; color: #666; }
        .card p { font-size: 24px; font-weight: bold; margin: 10px 0 0 0; }
        .income-card { border-top: 5px solid #2ecc71; color: #2ecc71; }
        .expense-card { border-top: 5px solid #e74c3c; color: #e74c3c; }
        .balance-card { border-top: 5px solid #3498db; color: #3498db; }
        .main-content { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-section, .chart-section { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        label { display: block; margin-top: 10px; font-weight: bold; color: #555; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 5px; }
        button { width: 100%; padding: 12px; background: #3498db; color: white; border: none; border-radius: 5px; margin-top: 15px; font-size: 16px; cursor: pointer; transition: 0.3s; }
        button:hover { background: #2980b9; }
    </style>
</head>
<body>

<div class="container">
    <h1>Family Budget Tracker 📊</h1>
    
    <!-- ড্যাশবোর্ড সামারি -->
    <div class="dashboard">
        <div class="card income-card">
            <h3>মোট আয়</h3>
            <p id="totalIncome">৳ ০</p>
        </div>
        <div class="card expense-card">
            <h3>মোট ব্যয়</h3>
            <p id="totalExpense">৳ ০</p>
        </div>
        <div class="card balance-card">
            <h3>বর্তমান ব্যালেন্স</h3>
            <p id="currentBalance">৳ ০</p>
        </div>
    </div>

    <div class="main-content">
        <!-- ডাটা এন্ট্রি ফর্ম -->
        <div class="form-section">
            <h2>নতুন এন্ট্রি যোগ করুন</h2>
            <form id="financeForm">
                <label for="date">তারিখ:</label>
                <input type="date" id="date" required>

                <label for="type">খাত সিলেক্ট করুন:</label>
                <select id="type" required>
                    <option value="Income">আয় (Income)</option>
                    <option value="Expense">ব্যয় (Expense)</option>
                </select>

                <label for="purpose">উদ্দেশ্য/বিবরণ:</label>
                <input type="text" id="purpose" placeholder="উদা: বেতন, বাজার খরচ, রানা দিয়েছে" required>

                <label for="amount">টাকার পরিমাণ (৳):</label>
                <input type="number" id="amount" placeholder="0.00" required>

                <button type="submit" id="submitBtn">হিসাব জমা দিন (Run)</button>
            </form>
        </div>

        <!-- ভিজুয়াল চার্ট ড্যাশবোর্ড -->
        <div class="chart-section">
            <h2>মাসিক রিপোর্ট (চার্ট)</h2>
            <canvas id="budgetChart"></canvas>
        </div>
    </div>
</div>

<script>
    // আজকের তারিখ অটোমেটিক ইনপুট ফিল্ডে সেট করার জন্য
    document.getElementById('date').valueAsDate = new Date();

    // চার্ট ইনিশিয়ালাইজেশন
    const ctx = document.getElementById('budgetChart').getContext('2d');
    let totalInc = 0;
    let totalExp = 0;

    const budgetChart = new Chart(ctx, {
        type: 'pie',
        data: {
            labels: ['আয়', 'ব্যয়'],
            datasets: [{
                data: [totalInc, totalExp],
                backgroundColor: ['#2ecc71', '#e74c3c']
            }]
        }
    });

    // ফর্ম সাবমিট হ্যান্ডলার
    document.getElementById('financeForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.innerText = "প্রসেসিং হচ্ছে...";
        submitBtn.disabled = true;

        const formData = {
            date: document.getElementById('date').value,
            type: document.getElementById('type').value,
            purpose: document.getElementById('purpose').value,
            amount: parseFloat(document.getElementById('amount').value)
        };

        // ⚠️ এখানে আপনার আসল গুগল অ্যাপস স্ক্রিপ্ট URL-টি বসান
        const scriptURL = 'https://script.google.com/macros/s/AKfycbx3n_5njvJ1-5HpJoUJjnG6JqATRQqM42b3pVWFD_-HUF0HOMdHwpGINp9PR7g2SauM/exec';

        fetch(scriptURL, {
            method: 'POST',
            mode: 'no-cors', // ক্রস-অরিজিন পলিসি হ্যান্ডেল করার জন্য
            cache: 'no-cache',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
        })
        .then(() => {
            // লোকাল ড্যাশবোর্ড আপডেট
            if(formData.type === 'Income') {
                totalInc += formData.amount;
            } else {
                totalExp += formData.amount;
            }
            
            updateDashboard();
            
            // ফর্ম রিসেট
            document.getElementById('purpose').value = '';
            document.getElementById('amount').value = '';
            submitBtn.innerText = "হিসাব জমা দিন (Run)";
            submitBtn.disabled = false;
            alert('সফলভাবে গুগল শিটে এন্ট্রি হয়েছে!');
        })
        .catch(error => {
            console.error('Error!', error.message);
            submitBtn.innerText = "হিসাব জমা দিন (Run)";
            submitBtn.disabled = false;
        });
    });

    function updateDashboard() {
        document.getElementById('totalIncome').innerText = '৳ ' + totalInc;
        document.getElementById('totalExpense').innerText = '৳ ' + totalExp;
        document.getElementById('currentBalance').innerText = '৳ ' + (totalInc - totalExp);
        
        // চার্ট আপডেট
        budgetChart.data.datasets[0].data = [totalInc, totalExp];
        budgetChart.update();
    }
</script>
</body>
</html>
